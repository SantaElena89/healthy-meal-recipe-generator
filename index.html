<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <title>Healthy Meal Recipe Generator</title>
    <link rel="stylesheet" href="src/style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>AI Healthy Meal Recipe Generator</h1>
        </header>
        <main>
            <form id="recipe-form">
                <input type="text" placeholder="Enter the main ingredient(-s)..." autofocus required autocomplete="off"
                    class="instructions" />

                <input class="submit-button" type="submit" value="Get Recipe" />
            </form>
            <div class="recipe" id="recipe-result">Cooking your recipe...👩‍🍳</div>
            <br />
        </main>
        <footer>
            This AI project is coded by <a href="https://github.com/SantaElena89" target="_blank">Elena Sozontova</a>
            and is
            open-sourced <a href="https://github.com/SantaElena89/healthy-meal-recipe-generator.git" target="_blank">on
                GitHub</a> and hosted <a href="https://ai-healthy-meal-recipe-generator.netlify.app/" target="_blank">on
                Netlify</a> </footer>
    </div>
    <script src="src/script.js"></script>
</body>

</html>
